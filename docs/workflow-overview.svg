<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Notion daily work tracker workflow</title>
  <desc id="desc">Capture and track daily work in Notion, complete and reflect on tasks, then organize approved items into reusable archive records. Cleanup requires a separate confirmation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#f8fafc"/>
  <text x="48" y="55" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">From today's tasks to reusable work records</text>
  <text x="48" y="84" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">The current approval-first Codex + Notion workflow</text>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M207 190 H231"/>
    <path d="M399 190 H423"/>
    <path d="M591 190 H615"/>
    <path d="M783 190 H807"/>
    <path d="M975 190 H999"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" filter="url(#shadow)">
    <g transform="translate(40 122)">
      <rect width="168" height="136" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="28" cy="28" r="16" fill="#dbeafe"/>
      <text x="28" y="33" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="700">1</text>
      <text x="18" y="72" fill="#0f172a" font-size="19" font-weight="700">Capture</text>
      <text x="18" y="99" fill="#475569" font-size="14">Add daily work</text>
      <text x="18" y="119" fill="#475569" font-size="14">in Notion</text>
    </g>
    <g transform="translate(232 122)">
      <rect width="168" height="136" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="28" cy="28" r="16" fill="#dbeafe"/>
      <text x="28" y="33" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="700">2</text>
      <text x="18" y="72" fill="#0f172a" font-size="19" font-weight="700">Track</text>
      <text x="18" y="99" fill="#475569" font-size="14">Keep active tasks</text>
      <text x="18" y="119" fill="#475569" font-size="14">visible</text>
    </g>
    <g transform="translate(424 122)">
      <rect width="168" height="136" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="28" cy="28" r="16" fill="#dcfce7"/>
      <text x="28" y="33" text-anchor="middle" fill="#15803d" font-size="14" font-weight="700">3</text>
      <text x="18" y="72" fill="#0f172a" font-size="19" font-weight="700">Complete</text>
      <text x="18" y="99" fill="#475569" font-size="14">Check Done</text>
      <text x="18" y="119" fill="#475569" font-size="14">when finished</text>
    </g>
    <g transform="translate(616 122)">
      <rect width="168" height="136" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="28" cy="28" r="16" fill="#fef3c7"/>
      <text x="28" y="33" text-anchor="middle" fill="#a16207" font-size="14" font-weight="700">4</text>
      <text x="18" y="72" fill="#0f172a" font-size="19" font-weight="700">Reflect</text>
      <text x="18" y="99" fill="#475569" font-size="14">Add Takeaway</text>
      <text x="18" y="119" fill="#475569" font-size="14">and Improvement</text>
    </g>
    <g transform="translate(808 122)">
      <rect width="168" height="136" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="28" cy="28" r="16" fill="#ede9fe"/>
      <text x="28" y="33" text-anchor="middle" fill="#6d28d9" font-size="14" font-weight="700">5</text>
      <text x="18" y="72" fill="#0f172a" font-size="19" font-weight="700">Organize</text>
      <text x="18" y="99" fill="#475569" font-size="14">Choose ok,</text>
      <text x="18" y="119" fill="#475569" font-size="14">dismiss, or skip</text>
    </g>
    <g transform="translate(1000 122)">
      <rect width="160" height="136" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="28" cy="28" r="16" fill="#ede9fe"/>
      <text x="28" y="33" text-anchor="middle" fill="#6d28d9" font-size="14" font-weight="700">6</text>
      <text x="18" y="72" fill="#0f172a" font-size="19" font-weight="700">Archive</text>
      <text x="18" y="99" fill="#475569" font-size="14">Save approved</text>
      <text x="18" y="119" fill="#475569" font-size="14">work by category</text>
    </g>
  </g>

  <rect x="40" y="304" width="1120" height="76" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <circle cx="76" cy="342" r="18" fill="#ffedd5"/>
  <path d="M70 340 V335 A6 6 0 0 1 82 335 V340 M68 340 H84 V351 H68 Z" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="334" fill="#9a3412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Cleanup is separate and approval-first</text>
  <text x="108" y="358" fill="#7c2d12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">done → summary → confirm → verified source/target checks</text>
</svg>
