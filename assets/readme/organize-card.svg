  <rect width="600" height="360" rx="24" fill="#0d1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">
    <rect x="36" y="34" width="528" height="292" rx="20" fill="#103a2a" stroke="#3fb950" stroke-width="3"/>

    <g transform="translate(68 66)">
      <rect width="76" height="76" rx="16" fill="#174f38"/>
      <path d="M22 26H54 M22 40H45 M22 54H40" fill="none" stroke="#b7f7c6" stroke-width="6" stroke-linecap="round"/>
      <path d="M48 54L55 61L68 44" fill="none" stroke="#b7f7c6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="402" y="72" width="126" height="38" rx="19" fill="#174f38" stroke="#3fb950" stroke-width="2"/>
    <circle cx="424" cy="91" r="6" fill="#3fb950"/>
    <text x="438" y="99" fill="#b7f7c6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700">APPROVAL</text>

    <text x="68" y="190" fill="#f0f6fc" font-size="48" font-weight="750">Organize</text>
    <text x="68" y="232" fill="#b7f7c6" font-size="32" font-weight="700">Archive completed work</text>
    <text x="68" y="275" fill="#d7dde5" font-size="23">Review completed work, then record</text>
