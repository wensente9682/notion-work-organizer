<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Organize turns two starting paths into an approval-first daily work flow</title>
  <desc id="hero-desc">An existing work database through read-only adoption and a blank or dedicated page through guided approved setup join Daily Work. Daily Work branches directly to optional Total and Organize review. Total may also enter Organize review, while the direct Organize path remains available. Organize review leads to approved reusable records. Source cleanup remains behind a separate done then confirm gate.</desc>
  <rect width="1200" height="700" rx="24" fill="#0d1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif">
    <text x="60" y="58" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="1.4">CODEX + NOTION · APPROVAL-FIRST DAILY WORK</text>
    <text x="60" y="112" fill="#f0f6fc" font-size="52" font-weight="750">A deliberate daily work loop.</text>

    <g transform="translate(60 150)">
      <rect width="500" height="132" rx="16" fill="#102d58" stroke="#388bfd" stroke-width="3"/>
      <circle cx="32" cy="42" r="9" fill="#388bfd"/>
      <text x="56" y="52" fill="#f0f6fc" font-size="36" font-weight="700">Existing work database</text>
      <text x="32" y="99" fill="#cae8ff" font-size="30">Read-only adoption</text>
    </g>
    <g transform="translate(640 150)">
      <rect width="500" height="132" rx="16" fill="#103a2a" stroke="#3fb950" stroke-width="3"/>
      <circle cx="32" cy="42" r="9" fill="#3fb950"/>
      <text x="56" y="52" fill="#f0f6fc" font-size="36" font-weight="700">Blank/dedicated page</text>
      <text x="32" y="99" fill="#b7f7c6" font-size="30">Guided approved setup</text>
    </g>

    <path d="M310 294V318H600V330 M890 294V318H600" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M594 326L600 338L606 326" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(420 342)">
      <rect width="360" height="126" rx="16" fill="#102d58" stroke="#388bfd" stroke-width="3"/>
      <text x="180" y="54" fill="#f0f6fc" text-anchor="middle" font-size="44" font-weight="700">Daily Work</text>
      <text x="180" y="96" fill="#cae8ff" text-anchor="middle" font-size="30">Track what matters</text>
    </g>

    <path d="M600 476V502H205V514 M600 502H620V514" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M199 510L205 522L211 510" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M614 510L620 522L626 510" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(70 524)">
      <rect width="270" height="112" rx="16" fill="#2d220a" stroke="#d29922" stroke-width="3"/>
      <text x="135" y="48" fill="#f0f6fc" text-anchor="middle" font-size="40" font-weight="700">Total</text>
      <text x="135" y="85" fill="#f2cc60" text-anchor="middle" font-size="30">Optional read-only</text>
    </g>
    <g transform="translate(460 524)">
      <rect width="320" height="112" rx="16" fill="#103a2a" stroke="#3fb950" stroke-width="3"/>
      <text x="160" y="48" fill="#f0f6fc" text-anchor="middle" font-size="38" font-weight="700">Organize review</text>
      <text x="160" y="85" fill="#b7f7c6" text-anchor="middle" font-size="30">Review with context</text>
    </g>
    <path d="M348 580H448" fill="none" stroke="#6e7681" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
    <path d="M442 575L452 580L442 585" fill="none" stroke="#6e7681" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M788 580H848" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>
    <path d="M842 575L852 580L842 585" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(860 524)">
      <rect width="280" height="112" rx="16" fill="#102d58" stroke="#388bfd" stroke-width="3"/>
      <text x="140" y="35" fill="#f0f6fc" text-anchor="middle" font-size="36" font-weight="700">Approved</text>
      <text x="140" y="70" fill="#cae8ff" text-anchor="middle" font-size="36" font-weight="700">reusable</text>
      <text x="140" y="105" fill="#cae8ff" text-anchor="middle" font-size="36" font-weight="700">records</text>
    </g>

    <rect x="60" y="660" width="1080" height="1" fill="#30363d"/>
    <circle cx="76" cy="660" r="7" fill="#d29922"/>
    <text x="100" y="670" fill="#f2cc60" font-size="24" font-weight="700">Source cleanup remains behind a separate done → confirm gate.</text>
  </g>
</svg>
